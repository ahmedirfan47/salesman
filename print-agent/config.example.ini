[salesman]
; Your Salesman API address, ending in /api/v1
api_url = https://your-salesman-api.onrender.com/api/v1
; The key shown once when you added this print agent in Salesman (starts with spa_)
agent_key = spa_paste_the_key_here
; Printer name exactly as Windows shows it. Leave empty for the default printer.
printer =
; pdf (any printer, Arabic supported) or escpos (thermal receipt printers, fastest)
mode = pdf
copies = 1
poll_seconds = 5
; escpos only: characters per line (42 for 80 mm paper, 32 for 58 mm) and whether to cut the paper
escpos_width = 42
escpos_cut = true
; Optional: full path to SumatraPDF.exe (recommended for silent PDF printing on Windows)
sumatra_path =
