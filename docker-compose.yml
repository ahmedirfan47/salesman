services:
  postgres:
    image: postgres:16
    container_name: salesman_postgres
    environment:
      POSTGRES_USER: salesman
      POSTGRES_PASSWORD: salesman
      POSTGRES_DB: salesman
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salesman"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: salesman_redis
    ports:
      - "6379:6379"

volumes:
  pgdata: